    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([54.5, -2], 6); // Centered on the UK

        // Store all landmarks and locations for search functionality
        let allLandmarks = [];
        let allLocations = [];

        // Function to add landmark to search index
        function addToSearchIndex(landmark, category) {
            allLandmarks.push({
                name: landmark.name || 'Unnamed Location',
                description: landmark.description || null,
                category: category,
                website: landmark.website || null,
                lat: landmark.lat || landmark.location?.lat,
                lon: landmark.lon || landmark.location?.lon,
                icon: getCategoryIcon(category),
                type: 'landmark'
            });
        }

        // Function to add location to search index
        function addLocationToSearchIndex(location) {
            allLocations.push({
                name: location.name,
                lat: location.lat,
                lon: location.lon,
                type: location.type,
                population: location.population,
                icon: getLocationIcon(location.type)
            });
        }

        // Function to get category icon
        function getCategoryIcon(category) {
            switch(category.toLowerCase()) {
                case 'landmark':
                    return 'fa-landmark';
                case 'entertainment':
                    return 'fa-theater-masks';
                case 'museum/gallery':
                    return 'fa-museum';
                case 'outdoor activity':
                    return 'fa-hiking';
                case 'viewpoint':
                    return 'fa-binoculars';
                default:
                    return 'fa-map-marker-alt';
            }
        }

        // Function to get location icon
        function getLocationIcon(type) {
            switch(type) {
                case 'city':
                    return 'fa-city';
                case 'town':
                    return 'fa-building';
                case 'village':
                    return 'fa-home';
                case 'hamlet':
                    return 'fa-house';
                case 'suburb':
                    return 'fa-building-user';
                default:
                    return 'fa-map-marker-alt';
            }
        }

        // Function to perform search
        function performSearch(query) {
            const landmarkResults = allLandmarks.filter(landmark => 
                landmark.name.toLowerCase().includes(query.toLowerCase())
            );
            
            const locationResults = allLocations.filter(location => 
                location.name.toLowerCase().includes(query.toLowerCase())
            );
            
            // Combine and sort results (locations > landmarks)
            const results = [
                ...locationResults.map(location => ({...location, priority: 1})),
                ...landmarkResults.map(landmark => ({...landmark, priority: 2}))
            ].sort((a, b) => {
                // Sort by priority first (locations before landmarks)
                if (a.priority !== b.priority) {
                    return a.priority - b.priority;
                }
                // Sort by type for locations
                if (a.type !== b.type) {
                    const typeOrder = { city: 1, town: 2, village: 3, hamlet: 4, suburb: 5, other: 6, landmark: 7 };
                    return typeOrder[a.type] - typeOrder[b.type];
                }
                // Sort alphabetically within each type
                return a.name.localeCompare(b.name);
            });
            
            return results.slice(0, 10); // Limit to 10 results
        }

        // Function to display search results
        function displaySearchResults(results) {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '';
            
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="search-result-item">No results found</div>';
            } else {
                results.forEach(result => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `
                        <i class="fas ${result.icon}"></i>
                        ${result.name}
                        ${result.type === 'landmark' 
                            ? `<span class="category">${result.category}</span>`
                            : `<span class="category">${result.type.charAt(0).toUpperCase() + result.type.slice(1)}</span>`
                        }
                    `;
                    div.addEventListener('click', () => {
                        if (result.type !== 'landmark') {
                            // For locations center the map
                            const zoomLevel = result.type === 'city' ? 12 : 
                                           result.type === 'town' ? 13 : 
                                           result.type === 'village' ? 14 : 
                                           result.type === 'hamlet' ? 15 : 16;
                            map.setView([result.lat, result.lon], zoomLevel);
                            searchResults.classList.remove('active');
                            document.getElementById('searchInput').value = '';
                        } else {
                            // For landmarks show the related details panel
                            showLandmarkDetails(result);
                            searchResults.classList.remove('active');
                            document.getElementById('searchInput').value = '';
                            
                            // Zoom to the selected location
                            if (result.lat && result.lon) {
                                map.setView([result.lat, result.lon], 18);
                            }
                        }
                    });
                    searchResults.appendChild(div);
                });
            }
            searchResults.classList.add('active');
        }

        // Add event listeners for search
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 2) {
                const results = performSearch(query);
                displaySearchResults(results);
            } else {
                searchResults.classList.remove('active');
            }
        });

        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.remove('active');
            }
        });

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Create marker clusters for each category
        const markerClusters = {
            landmarks: L.markerClusterGroup(),
            entertainment: L.markerClusterGroup(),
            museums: L.markerClusterGroup(),
            outdoor: L.markerClusterGroup(),
            viewpoints: L.markerClusterGroup()
        };

        // Add clusters to map initially
        Object.values(markerClusters).forEach(cluster => {
            cluster.addTo(map);
        });

        // Function to check if coordinates are within UK mainland
        function isInUKMainland(lat, lon) {
            // Main UK mainland boundaries
            const ukBounds = {
                north: 58.6,  // Northernmost point of Scotland
                south: 50.0,  // Southernmost point of England
                west: -5.7,   // Westernmost point of Wales
                east: 1.7     // Easternmost point of England
            };
            
            // Specific areas to exclude
            const excludedAreas = [
                // Northern Ireland
                { minLat: 53.9, maxLat: 55.5, minLon: -8.5, maxLon: -5.3 },
                // Isle of Man
                { minLat: 53.9, maxLat: 54.4, minLon: -4.8, maxLon: -4.2 },
                // Channel Islands
                { minLat: 49.0, maxLat: 49.5, minLon: -2.7, maxLon: -1.9 },
                // France
                { minLat: 48.0, maxLat: 51.0, minLon: -2.0, maxLon: -1.0 }
            ];
            
            // Check if point is within main UK bounds
            const isInMainBounds = lat >= ukBounds.south && 
                                 lat <= ukBounds.north && 
                                 lon >= ukBounds.west && 
                                 lon <= ukBounds.east;
            
            // Check if point is in any excluded area
            const isInExcludedArea = excludedAreas.some(area => 
                lat >= area.minLat && 
                lat <= area.maxLat && 
                lon >= area.minLon && 
                lon <= area.maxLon
            );
            
            return isInMainBounds && !isInExcludedArea;
        }

        // Function to fetch description from Wikipedia
        async function fetchWikipediaDescription(landmarkName) {
            try {
                const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&titles=${encodeURIComponent(landmarkName)}&origin=*`;
                const response = await fetch(searchUrl);
                const data = await response.json();
                
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                const extract = pages[pageId].extract;
                
                if (extract) {
                    // Get the first paragraph
                    const firstParagraph = extract.split('\n')[0];
                    return firstParagraph;
                }
                return null;
            } catch (error) {
                console.error('Error fetching Wikipedia description:', error);
                return null;
            }
        }

        // Function to fetch image from Wikimedia Commons
        async function fetchLandmarkImage(landmarkName) {
            try {
                // Wikipedia page for the landmark
                const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&titles=${encodeURIComponent(landmarkName)}&pithumbsize=500&origin=*`;
                const response = await fetch(searchUrl);
                const data = await response.json();
                
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                const imageUrl = pages[pageId].thumbnail?.source;
                
                if (imageUrl) {
                    return imageUrl;
                }
                
                // If no image found, try a more general search for relevant image
                const searchQuery = `${landmarkName} UK landmark`;
                const commonsSearchUrl = `https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srsearch=${encodeURIComponent(searchQuery)}&srnamespace=6&srlimit=1&origin=*`;
                const commonsResponse = await fetch(commonsSearchUrl);
                const commonsData = await commonsResponse.json();
                
                if (commonsData.query.search.length > 0) {
                    const title = commonsData.query.search[0].title;
                    const imageInfoUrl = `https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url&titles=${encodeURIComponent(title)}&origin=*`;
                    const imageInfoResponse = await fetch(imageInfoUrl);
                    const imageInfoData = await imageInfoResponse.json();
                    
                    const imagePages = imageInfoData.query.pages;
                    const imagePageId = Object.keys(imagePages)[0];
                    return imagePages[imagePageId].imageinfo[0].url;
                }
                
                return null;
            } catch (error) {
                console.error('Error fetching image:', error);
                return null;
            }
        }

        // Function to fetch address from coordinates
        async function fetchAddress(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1&zoom=18`);
                const data = await response.json();
                
                if (data.address) {
                    const address = data.address;
                    // Build address string from available components
                    const addressParts = [];
                    
                    if (address.road) addressParts.push(address.road);
                    if (address.house_number) addressParts.push(address.house_number);
                    if (address.town) addressParts.push(address.town);
                    if (address.city) addressParts.push(address.city);
                    if (address.county) addressParts.push(address.county);
                    if (address.postcode) addressParts.push(address.postcode);
                    
                    return addressParts.join(', ');
                }
                return null;
            } catch (error) {
                console.error('Error fetching address:', error);
                return null;
            }
        }

        // Function to show landmark details
        async function showLandmarkDetails(landmark) {
            console.log(landmark);
            
            // First close the panel if it's open
            if (landmarkPanel.classList.contains('active')) {
                landmarkPanel.classList.remove('active');
                mapContainer.classList.remove('with-panel');
                
                // Wait for the close animation to complete (300ms as defined in CSS)
                await new Promise(resolve => setTimeout(resolve, 300));
            }

            const imageUrl = await fetchLandmarkImage(landmark.name);
            let description = landmark.description;
            let address = null;
            
            // If no description, try to get one from Wikipedia
            if (!description) {
                description = await fetchWikipediaDescription(landmark.name);
                if (!description) {
                    description = `A ${landmark.category} location in the UK.`;
                }
            }

            // Get address if coordinates are available
            if (landmark.lat && landmark.lon) {
                address = await fetchAddress(landmark.lat, landmark.lon);
            }
            let content = '';
            if (imageUrl) {
                content += `
                    <div class="image-container">
                        <img src="${imageUrl}" 
                         alt="${landmark.name}" 
                         onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/United_Kingdom_location_map.svg/500px-United_Kingdom_location_map.svg.png';">
                    </div>`
            }
            content += `
                <h3 class="landmark-name">${landmark.name}</h3>
                ${address ? `<p class="address-text"><i class="fas fa-map-marker-alt mr-2"></i>${address}</p>` : ''}
                <p class="description-text">${description}</p>
                ${landmark.lat && landmark.lon ? `<a href="http://maps.google.com/maps?q=${landmark.lat},${landmark.lon}" target="_blank" class="learn-more-button map-button">View on Google Maps</a>` : ''}
                ${landmark.website ? `<a href="${landmark.website}" target="_blank" class="learn-more-button">Learn More</a>` : ''}
            `;
            landmarkContent.innerHTML = content;
            
            // Now open the panel with the new content
            landmarkPanel.classList.add('active');
            mapContainer.classList.add('with-panel');
        }

        // Modify the loadMarkersFromFile function to add landmarks to search index
        async function loadMarkersFromFile(filePath, category, cluster) {
            try {
                const response = await fetch(filePath);
                const data = await response.json();
                
                if (data.elements) {
                    // Process markers in batches
                    const batchSize = 1000;
                    const elements = data.elements;
                    
                    for (let i = 0; i < elements.length; i += batchSize) {
                        const batch = elements.slice(i, i + batchSize);
                        const markers = [];
                        
                        batch.forEach(item => {
                            let lat, lon;
                            if (item.lat && item.lon) {
                                lat = item.lat;
                                lon = item.lon;
                            } else if (item.location) {
                                lat = item.location.lat;
                                lon = item.location.lon;
                            }

                            if (lat && lon && isInUKMainland(lat, lon)) {
                                const marker = L.marker([lat, lon]);
                                const landmarkData = {
                                    name: item.name || 'Unnamed Location',
                                    description: item.description || null,
                                    category: category,
                                    website: item.website || null,
                                    lat: lat,
                                    lon: lon
                                };
                                
                                marker.on('click', () => {
                                    showLandmarkDetails(landmarkData);
                                });
                                
                                // Add to search index
                                addToSearchIndex(landmarkData, category);
                                
                                markers.push(marker);
                            }
                        });

                        // Add batch to cluster
                        cluster.addLayers(markers);
                        
                        // Small delay between batches to prevent UI freezing
                        await new Promise(resolve => setTimeout(resolve, 50));
                    }
                }
            } catch (error) {
                console.error(`Error loading ${category} data:`, error);
            }
        }

        // Load all data files
        Promise.all([
            loadMarkersFromFile('../data/tourist_spots_landmarks.json', 'Landmark', markerClusters.landmarks),
            loadMarkersFromFile('../data/tourist_spots_entertainment.json', 'Entertainment', markerClusters.entertainment),
            loadMarkersFromFile('../data/tourist_spots_museums_galleries.json', 'Museum/Gallery', markerClusters.museums),
            loadMarkersFromFile('../data/tourist_spots_outdoor_activities.json', 'Outdoor Activity', markerClusters.outdoor),
            loadMarkersFromFile('../data/tourist_spots_viewpoints.json', 'Viewpoint', markerClusters.viewpoints),
            // Load locations data
            fetch('../data/uk_locations.json')
                .then(response => response.json())
                .then(data => {
                    if (data.elements) {
                        data.elements.forEach(location => {
                            addLocationToSearchIndex(location);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error loading locations data:', error);
                })
        ]).then(() => {
            console.log('All markers and locations loaded');
            map.invalidateSize();
        }).catch(error => {
            console.error('Error loading data:', error);
        });

        // Update filter event listeners to work with clusters
        document.getElementById('landmarks').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(markerClusters.landmarks);
            } else {
                map.removeLayer(markerClusters.landmarks);
            }
        });

        document.getElementById('entertainment').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(markerClusters.entertainment);
            } else {
                map.removeLayer(markerClusters.entertainment);
            }
        });

        document.getElementById('museums').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(markerClusters.museums);
            } else {
                map.removeLayer(markerClusters.museums);
            }
        });

        document.getElementById('outdoor').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(markerClusters.outdoor);
            } else {
                map.removeLayer(markerClusters.outdoor);
            }
        });

        document.getElementById('viewpoints').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(markerClusters.viewpoints);
            } else {
                map.removeLayer(markerClusters.viewpoints);
            }
        });

        // Get DOM elements
        const landmarkPanel = document.getElementById('landmarkPanel');
        const landmarkContent = document.getElementById('landmarkContent');
        const mapContainer = document.getElementById('mapContainer');
        const closeButton = document.getElementById('closePanel');

        // Function to close the panel
        function closePanel() {
            landmarkPanel.classList.remove('active');
            mapContainer.classList.remove('with-panel');
        }

        // Add close button event listener
        closeButton.addEventListener('click', closePanel);

        // Close panel when clicking outside 
        document.addEventListener('click', (e) => {
            if (!landmarkPanel.contains(e.target) && !e.target.closest('.leaflet-marker-icon')) {
                landmarkPanel.classList.remove('active');
                mapContainer.classList.remove('with-panel');
            }
        });
    </script>
</body>
</html>
